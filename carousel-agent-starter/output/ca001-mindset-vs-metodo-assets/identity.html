<!doctype html>
<html><head><meta charset="utf-8"><style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1080px;height:1350px;background:#0F0F1A;overflow:hidden;position:relative;font-family:sans-serif}
  .glow1{position:absolute;left:-140px;top:-120px;width:820px;height:820px;border-radius:50%;
    background:radial-gradient(circle,rgba(58,145,183,.32),transparent 68%);filter:blur(10px)}
  .glow2{position:absolute;right:-160px;bottom:-160px;width:900px;height:900px;border-radius:50%;
    background:radial-gradient(circle,rgba(224,120,0,.30),transparent 68%);filter:blur(10px)}
  .grid{position:absolute;inset:0;opacity:.35;
    background-image:radial-gradient(rgba(255,255,255,.06) 1.6px,transparent 1.6px);background-size:38px 38px}
  svg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
</style></head>
<body>
  <div class="glow1"></div>
  <div class="glow2"></div>
  <div class="grid"></div>

  <svg width="900" height="900" viewBox="0 0 900 900">
    <defs>
      <radialGradient id="core" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#FFC24D"/>
        <stop offset="45%" stop-color="#E07800"/>
        <stop offset="100%" stop-color="#3A91B7"/>
      </radialGradient>
      <linearGradient id="ringA" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#E07800" stop-opacity=".55"/>
        <stop offset="100%" stop-color="#3A91B7" stop-opacity=".55"/>
      </linearGradient>
    </defs>

    <!-- anello esterno: cosa fai (azioni, tattiche) -->
    <circle cx="450" cy="450" r="390" fill="none" stroke="url(#ringA)" stroke-width="2" stroke-dasharray="3 13"/>
    <!-- anello medio: come lo fai (metodo, sistema) -->
    <circle cx="450" cy="450" r="270" fill="none" stroke="rgba(255,255,255,.16)" stroke-width="1.5" stroke-dasharray="2 10"/>
    <!-- nucleo: chi sei (identita', mindset) -->
    <circle cx="450" cy="450" r="150" fill="url(#core)" opacity="0.95"/>
    <circle cx="450" cy="450" r="150" fill="none" stroke="#fff" stroke-opacity=".25" stroke-width="2"/>

    <!-- piccola figura umana stilizzata al centro, luminosa -->
    <g transform="translate(450,450)">
      <circle cx="0" cy="-34" r="20" fill="#0F0F1A" opacity=".85"/>
      <path d="M -32 46 C -32 4 -18 -12 0 -12 C 18 -12 32 4 32 46 Z" fill="#0F0F1A" opacity=".85"/>
    </g>

    <!-- punti orbitanti sull'anello esterno: i vari tentativi (corsi, video...) -->
    <circle cx="450" cy="60" r="9" fill="#E07800"/>
    <circle cx="817" cy="450" r="9" fill="#8D845C"/>
    <circle cx="450" cy="840" r="9" fill="#3A91B7"/>
    <circle cx="83" cy="450" r="9" fill="#6b6f8a"/>
  </svg>

  <svg width="1080" height="1350" style="left:0;top:0;transform:none;position:absolute">
    <g stroke="rgba(255,255,255,.14)" stroke-width="2" fill="none">
      <path d="M96 60 v36 M96 60 h36"/>
      <path d="M984 60 v36 M984 60 h-36"/>
      <path d="M96 1290 v-36 M96 1290 h36"/>
      <path d="M984 1290 v-36 M984 1290 h-36"/>
    </g>
  </svg>
</body></html>
