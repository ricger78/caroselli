<!doctype html>
<html><head><meta charset="utf-8"><style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{width:1080px;height:1350px;background:#0F0F1A;overflow:hidden;position:relative;font-family:sans-serif}
  .glow1{position:absolute;left:-120px;top:-100px;width:820px;height:820px;border-radius:50%;
    background:radial-gradient(circle,rgba(224,120,0,.35),transparent 68%);filter:blur(10px)}
  .glow2{position:absolute;right:-160px;bottom:-140px;width:900px;height:900px;border-radius:50%;
    background:radial-gradient(circle,rgba(58,145,183,.38),transparent 68%);filter:blur(10px)}
  .grid{position:absolute;inset:0;opacity:.35;
    background-image:radial-gradient(rgba(255,255,255,.06) 1.6px,transparent 1.6px);background-size:38px 38px}
  svg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
  .chip{position:absolute;width:118px;height:118px;border-radius:30px;display:flex;align-items:center;justify-content:center;
    box-shadow:0 18px 50px rgba(0,0,0,.5)}
  .chip svg{position:static;transform:none}
</style></head>
<body>
  <div class="glow1"></div>
  <div class="glow2"></div>
  <div class="grid"></div>

  <svg width="820" height="820" viewBox="0 0 820 820">
    <defs>
      <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#E07800"/>
        <stop offset="50%" stop-color="#8D845C"/>
        <stop offset="100%" stop-color="#3A91B7"/>
      </linearGradient>
    </defs>
    <circle cx="410" cy="410" r="300" fill="none" stroke="url(#ring)" stroke-width="26" stroke-linecap="round"
      stroke-dasharray="1600 90" opacity="0.92"/>
    <circle cx="410" cy="410" r="300" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="1" stroke-dasharray="2 14"/>
    <!-- arrowhead chasing the loop -->
    <path d="M 690 300 L 730 330 L 682 356 Z" fill="#3A91B7"/>
  </svg>

  <!-- 4 stage chips SULL'ANELLO (centro 540,675 raggio 300, coerente con l'svg sopra): corso, video, certificato, obiettivo -->
  <div class="chip" style="left:481px;top:316px;background:linear-gradient(135deg,#E07800,#c96a00)">
    <svg width="52" height="52" viewBox="0 0 24 24" fill="none"><path d="M4 4h11a3 3 0 0 1 3 3v13H7a3 3 0 0 1-3-3V4Z" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/><path d="M4 17a3 3 0 0 1 3-3h11" stroke="#fff" stroke-width="1.8"/></svg>
  </div>
  <div class="chip" style="left:781px;top:616px;background:linear-gradient(135deg,#7a8a6e,#5c6a52)">
    <svg width="50" height="50" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9.5" stroke="#fff" stroke-width="1.8"/><path d="M10 8.5 16 12l-6 3.5v-7Z" fill="#fff"/></svg>
  </div>
  <div class="chip" style="left:481px;top:916px;background:linear-gradient(135deg,#3A91B7,#2c7593)">
    <svg width="52" height="52" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="4.2" stroke="#fff" stroke-width="1.8"/><path d="M7 21l1.6-6.4M17 21l-1.6-6.4" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/></svg>
  </div>
  <div class="chip" style="left:181px;top:616px;background:linear-gradient(135deg,#6b6f8a,#4c5068)">
    <svg width="50" height="50" viewBox="0 0 24 24" fill="none"><rect x="4.5" y="4.5" width="15" height="15" rx="3" stroke="#fff" stroke-width="1.8"/></svg>
  </div>

  <!-- corner brackets, coerenti con lo stile del kit -->
  <svg width="1080" height="1350" style="left:0;top:0;transform:none;position:absolute">
    <g stroke="rgba(255,255,255,.14)" stroke-width="2" fill="none">
      <path d="M96 60 v36 M96 60 h36"/>
      <path d="M984 60 v36 M984 60 h-36"/>
      <path d="M96 1290 v-36 M96 1290 h36"/>
      <path d="M984 1290 v-36 M984 1290 h-36"/>
    </g>
  </svg>
</body></html>
